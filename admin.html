<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Order Management Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin Specific Overrides */
        body {
            background-color: var(--color-bg-alt);
        }
        .admin-header {
            background-color: var(--color-text);
            color: var(--color-bg);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .admin-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .admin-brand-logo {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            letter-spacing: 0.2em;
            color: var(--color-bg);
        }
        .admin-badge {
            background-color: var(--color-accent);
            color: var(--color-text);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .admin-container {
            max-width: var(--max-width);
            margin: 40px auto;
            padding: 0 40px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }
        .metric-card {
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: var(--shadow-subtle);
        }
        .metric-title {
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
        }
        .metric-value {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: var(--color-text);
        }
        .metric-sub {
            font-size: 0.75rem;
            color: var(--color-success);
        }
        
        /* Table Controls */
        .admin-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 20px;
        }
        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            background-color: var(--color-bg);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
        }

        /* Orders Table */
        .orders-table-wrapper {
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            overflow-x: auto;
            box-shadow: var(--shadow-subtle);
        }
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }
        .orders-table th {
            background-color: #F0EDE6;
            padding: 16px 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-text-muted);
            border-bottom: 1px solid var(--color-border);
        }
        .orders-table td {
            padding: 18px 20px;
            border-bottom: 1px solid var(--color-border);
            vertical-align: middle;
        }
        .orders-table tr:hover {
            background-color: rgba(243, 239, 233, 0.4);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-processing {
            background-color: rgba(197, 160, 89, 0.15);
            color: var(--color-accent-dark);
        }
        .status-shipped {
            background-color: rgba(93, 140, 109, 0.15);
            color: var(--color-success);
        }
        .status-delivered {
            background-color: rgba(28, 26, 23, 0.1);
            color: var(--color-text);
        }
        .status-cancelled {
            background-color: rgba(176, 91, 91, 0.15);
            color: var(--color-error);
        }

        .method-badge {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--color-text-muted);
        }

        .action-select {
            padding: 6px 10px;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            font-size: 0.8rem;
            font-family: inherit;
            background-color: var(--color-bg);
            cursor: pointer;
        }

        /* Order Details Modal */
        .order-detail-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }
        .order-detail-item {
            display: flex;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--color-border);
            font-size: 0.9rem;
        }

        @media (max-width: 992px) {
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="admin-header">
        <div class="admin-brand">
            <span class="admin-brand-logo">AURA</span>
            <span class="admin-badge">Admin Desk</span>
        </div>
        <div style="display: flex; gap: 20px; align-items: center;">
            <button id="refresh-orders-btn" class="btn btn-outline" style="color: white; border-color: rgba(255,255,255,0.3); padding: 8px 16px;">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
            <a href="index.html" class="btn btn-primary" style="background-color: var(--color-accent); border-color: var(--color-accent); color: var(--color-text); padding: 8px 16px;">
                <i class="fa-solid fa-store"></i> Back to Store
            </a>
        </div>
    </header>

    <main class="admin-container">
        <!-- Overview Metrics -->
        <section class="metrics-grid">
            <div class="metric-card">
                <span class="metric-title">Total Revenue</span>
                <span class="metric-value" id="metric-revenue">₹0</span>
                <span class="metric-sub"><i class="fa-solid fa-chart-line"></i> Live Collected Sales</span>
            </div>
            <div class="metric-card">
                <span class="metric-title">Total Orders</span>
                <span class="metric-value" id="metric-total-orders">0</span>
                <span class="metric-sub">Across All Channels</span>
            </div>
            <div class="metric-card">
                <span class="metric-title">Processing</span>
                <span class="metric-value" id="metric-processing-orders">0</span>
                <span class="metric-sub" style="color: var(--color-accent-dark);">Action Needed</span>
            </div>
            <div class="metric-card">
                <span class="metric-title">Shipped / Completed</span>
                <span class="metric-value" id="metric-completed-orders">0</span>
                <span class="metric-sub"><i class="fa-solid fa-check"></i> Fulfilled</span>
            </div>
        </section>

        <!-- Search and Filters -->
        <section class="admin-controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="order-search-input" placeholder="Search by Order ID, Customer, or Email...">
            </div>
            
            <div class="filter-group">
                <button class="filter-tab active" data-admin-filter="all">All</button>
                <button class="filter-tab" data-admin-filter="Processing">Processing</button>
                <button class="filter-tab" data-admin-filter="Shipped">Shipped</button>
                <button class="filter-tab" data-admin-filter="Delivered">Delivered</button>
            </div>
        </section>

        <!-- Orders Table -->
        <section class="orders-table-wrapper">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date & Time</th>
                        <th>Customer</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <!-- Injected dynamically via JS -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Order Detail View Modal -->
    <div class="modal-overlay" id="admin-order-modal">
        <div class="modal-card" style="max-width: 600px; padding: 40px;">
            <button class="modal-close" onclick="closeAdminModal()"><i class="fa-solid fa-xmark"></i></button>
            <div id="admin-modal-content">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script>
        let allOrders = [];
        let currentFilter = "all";

        document.addEventListener("DOMContentLoaded", () => {
            fetchOrders();
            setupAdminListeners();
        });

        function setupAdminListeners() {
            document.getElementById("refresh-orders-btn").addEventListener("click", fetchOrders);

            document.getElementById("order-search-input").addEventListener("input", renderAdminTable);

            document.querySelectorAll("[data-admin-filter]").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    document.querySelectorAll("[data-admin-filter]").forEach(b => b.classList.remove("active"));
                    e.target.classList.add("active");
                    currentFilter = e.target.dataset.adminFilter;
                    renderAdminTable();
                });
            });
        }

        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();

                if (data.success) {
                    allOrders = data.data;
                    updateMetrics();
                    renderAdminTable();
                }
            } catch (err) {
                console.error("Error fetching orders:", err);
            }
        }

        function updateMetrics() {
            const totalRevenue = allOrders
                .filter(o => o.orderStatus !== "Cancelled")
                .reduce((sum, o) => sum + o.totalAmount, 0);

            const processingCount = allOrders.filter(o => o.orderStatus === "Processing").length;
            const completedCount = allOrders.filter(o => o.orderStatus === "Shipped" || o.orderStatus === "Delivered").length;

            document.getElementById("metric-revenue").textContent = `₹${totalRevenue.toLocaleString('en-IN')}`;
            document.getElementById("metric-total-orders").textContent = allOrders.length;
            document.getElementById("metric-processing-orders").textContent = processingCount;
            document.getElementById("metric-completed-orders").textContent = completedCount;
        }

        function renderAdminTable() {
            const tbody = document.getElementById("orders-tbody");
            const searchQuery = document.getElementById("order-search-input").value.toLowerCase();

            let filtered = [...allOrders];

            // Apply Status Filter
            if (currentFilter !== "all") {
                filtered = filtered.filter(o => o.orderStatus === currentFilter);
            }

            // Apply Search Query
            if (searchQuery) {
                filtered = filtered.filter(o => 
                    o.id.toLowerCase().includes(searchQuery) ||
                    o.customer.fullName.toLowerCase().includes(searchQuery) ||
                    o.customer.email.toLowerCase().includes(searchQuery)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: var(--color-text-muted);">
                            No orders found matching the filter criteria.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(order => {
                const dateStr = new Date(order.createdAt).toLocaleString('en-IN', {
                    day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                const itemCount = order.items.reduce((sum, i) => sum + i.quantity, 0);
                const statusClass = `status-${order.orderStatus.toLowerCase()}`;

                return `
                    <tr>
                        <td><strong><a href="#" onclick="viewOrderDetails('${order.id}'); return false;" style="border-bottom: 1px solid var(--color-text);">${order.id}</a></strong></td>
                        <td style="color: var(--color-text-muted); font-size: 0.8rem;">${dateStr}</td>
                        <td>
                            <div><strong>${escapeHtml(order.customer.fullName)}</strong></div>
                            <div style="font-size: 0.75rem; color: var(--color-text-muted);">${escapeHtml(order.customer.email)}</div>
                        </td>
                        <td>${itemCount} ${itemCount === 1 ? 'bottle' : 'bottles'}</td>
                        <td><strong>₹${order.totalAmount.toLocaleString('en-IN')}</strong></td>
                        <td>
                            <span class="method-badge">${order.paymentMethod.toUpperCase()}</span>
                            <div style="font-size: 0.7rem; color: var(--color-success);">${order.paymentStatus}</div>
                        </td>
                        <td>
                            <span class="status-pill ${statusClass}">
                                <i class="fa-solid fa-circle" style="font-size: 6px;"></i> ${order.orderStatus}
                            </span>
                        </td>
                        <td>
                            <select class="action-select" onchange="updateStatus('${order.id}', this.value)">
                                <option value="Processing" ${order.orderStatus === 'Processing' ? 'selected' : ''}>Processing</option>
                                <option value="Shipped" ${order.orderStatus === 'Shipped' ? 'selected' : ''}>Mark Shipped</option>
                                <option value="Delivered" ${order.orderStatus === 'Delivered' ? 'selected' : ''}>Mark Delivered</option>
                                <option value="Cancelled" ${order.orderStatus === 'Cancelled' ? 'selected' : ''}>Cancel Order</option>
                            </select>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch(`/api/orders/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    fetchOrders();
                }
            } catch (err) {
                console.error("Failed to update status:", err);
            }
        }

        function viewOrderDetails(id) {
            const order = allOrders.find(o => o.id === id);
            if (!order) return;

            const modalContent = document.getElementById("admin-modal-content");
            modalContent.innerHTML = `
                <span class="section-label">Order Manifest</span>
                <h2 style="font-family: var(--font-serif); font-size: 2rem; margin-bottom: 8px;">${order.id}</h2>
                <p style="margin-bottom: 20px; font-size: 0.85rem;">Placed on ${new Date(order.createdAt).toLocaleString()}</p>
                
                <div style="background-color: var(--color-bg-alt); padding: 16px; border-radius: 4px; margin-bottom: 20px;">
                    <h4 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; color: var(--color-text);">Shipping Address</h4>
                    <p style="font-size: 0.85rem; color: var(--color-text);"><strong>${escapeHtml(order.customer.fullName)}</strong></p>
                    <p style="font-size: 0.85rem; color: var(--color-text-muted);">${escapeHtml(order.customer.address)}</p>
                    <p style="font-size: 0.85rem; color: var(--color-text-muted);">${escapeHtml(order.customer.city)}, ${escapeHtml(order.customer.state)} - ${escapeHtml(order.customer.pincode)}</p>
                    <p style="font-size: 0.85rem; color: var(--color-text-muted); margin-top: 4px;">Phone: ${escapeHtml(order.customer.phone)}</p>
                </div>

                <h4 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; color: var(--color-text);">Ordered Fragrances</h4>
                <div class="order-detail-items">
                    ${order.items.map(item => `
                        <div class="order-detail-item">
                            <div>
                                <strong>${escapeHtml(item.name)}</strong> (${item.size}) x ${item.quantity}
                                <div style="font-size: 0.75rem; color: var(--color-text-muted); text-transform: uppercase;">${item.edition} Edition</div>
                            </div>
                            <div>₹${(item.price * item.quantity).toLocaleString('en-IN')}</div>
                        </div>
                    `).join('')}
                </div>

                <div style="display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 600; padding-top: 12px; border-top: 1px solid var(--color-border);">
                    <span>Total Amount Paid</span>
                    <span>₹${order.totalAmount.toLocaleString('en-IN')}</span>
                </div>
            `;

            document.getElementById("admin-order-modal").classList.add("active");
        }

        function closeAdminModal() {
            document.getElementById("admin-order-modal").classList.remove("active");
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }
    </script>
</body>
</html>
